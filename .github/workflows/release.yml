# Builds the Windows installer on GitHub's own Windows machines and publishes it as a release.
# Push a tag like v1.0.1 (or run it by hand from the Actions tab) and every installed
# Glass Dock picks the new version up automatically.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installer and publish the release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
