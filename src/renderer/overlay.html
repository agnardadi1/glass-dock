<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Glass Dock animation</title>
  <style>
    :root { --card: rgba(246,248,251,.94); --bar: rgba(225,229,236,.96); --fg: #1d2330; --edge: rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) { :root { --card: rgba(36,39,50,.94); --bar: rgba(52,56,70,.96); --fg: #eef1f7; --edge: rgba(255,255,255,.1); } }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    .ghost {
      position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity;
      background: var(--card); border: 1px solid var(--edge); border-radius: 10px; overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35); display: flex; flex-direction: column;
    }
    .ghost .bar { height: 34px; flex: none; background: var(--bar); display: flex; align-items: center; padding: 0 14px; color: var(--fg); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ghost .body { flex: 1; display: grid; place-items: center; }
    .ghost img { width: min(30%, 160px); aspect-ratio: 1; object-fit: contain; opacity: .9; }
  </style>
</head>
<body>
  <script src="overlay.js"></script>
</body>
</html>
