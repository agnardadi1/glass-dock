<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Locked</title>
  <style>
    :root { --ink: #f5f6f8; --dim: rgba(245,246,248,.6); --faint: rgba(255,255,255,.12); --accent: #0a84ff; --red: #ff453a;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px var(--font); color: var(--ink); user-select: none; }
    .box {
      position: absolute; inset: 8px; padding: 22px; display: grid; align-content: start; gap: 14px; justify-items: center;
      background: rgba(10,11,16,.96); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
      animation: pop .2s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes pop { from { opacity: 0; transform: scale(.94); } }
    .box.shake { animation: shake .35s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    svg { width: 28px; height: 28px; color: var(--dim); }
    input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--faint); background: rgba(255,255,255,.06); color: var(--ink); font: 15px var(--font); text-align: center; outline: none; }
    input:focus { border-color: var(--accent); }
    .msg { min-height: 16px; color: var(--dim); font-size: 12px; }
    .msg.bad { color: var(--red); }
    .list { width: 100%; display: grid; gap: 6px; }
    .list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--faint); color: var(--ink); font: 600 14px var(--font); cursor: pointer; text-align: left; }
    .list button:hover, .list button:focus-visible { background: rgba(255,255,255,.2); outline: none; }
    .list span { font-size: 18px; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <input id="pw" type="password" placeholder="Password" autocomplete="off" aria-label="Password">
    <div class="msg" id="msg">Enter to open · Esc to cancel</div>
    <div class="list" id="list" hidden></div>
  </div>
  <script src="lock.js"></script>
</body>
</html>
